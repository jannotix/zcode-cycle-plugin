name: release-candidate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full clean commit SHA to certify
        required: true
        type: string
      confirmation:
        description: Type CERTIFY_ZCODE_1_0_1
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "26.3.0"
  RUST_TOOLCHAIN: "1.97.1"
  VERSION: "1.0.1"

jobs:
  admission:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.admit.outputs.sha }}
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - id: admit
        name: Admit exact clean 1.0.1 source
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "CERTIFY_ZCODE_1_0_1"
          test "${{ inputs.expected_sha }}" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          test "$(node -p "require('./.zcode-plugin/plugin.json').version")" = "$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  native:
    needs: admission
    name: certify-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
            binary: target/release/workflowd
          - target: win32-x64
            os: windows-2025
            binary: target/release/workflowd.exe
    steps:
      - name: Checkout admitted SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.admission.outputs.sha }}
          fetch-depth: 0

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache Rust outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Install pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Rust quality
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features --no-fail-fast

      - name: MCP quality and audit
        working-directory: mcp
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
          bun run test
          bun audit --production

      - name: Marketplace and role boundaries
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-marketplace.mjs
          node --test tests/qualification/*.test.mjs

      - name: Build release daemon
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C link-arg=/Brepro' || '' }}
        run: cargo build --release --locked -p workflowd

      - name: Verify reproducible Windows relink
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: -C link-arg=/Brepro
        run: |
          $first = (Get-FileHash -LiteralPath '${{ matrix.binary }}' -Algorithm SHA256).Hash
          Remove-Item -LiteralPath '${{ matrix.binary }}' -Force
          cargo build --release --locked -p workflowd
          $second = (Get-FileHash -LiteralPath '${{ matrix.binary }}' -Algorithm SHA256).Hash
          if ($first -ne $second) {
            throw "Windows release relink is not reproducible: $first != $second"
          }

      - name: Require and apply Authenticode signature
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODESIGN_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:CODESIGN_PASSWORD)) {
            throw 'Windows code-signing secrets are required'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'zcode-cycle-signing.pfx'
          $bytes = [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64)
          try {
            [IO.File]::WriteAllBytes($pfx, $bytes)
            $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe was not found' }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:CODESIGN_PASSWORD '${{ matrix.binary }}'
            if ($LASTEXITCODE -ne 0) { throw "signtool failed: $LASTEXITCODE" }
            $signature = Get-AuthenticodeSignature -LiteralPath '${{ matrix.binary }}'
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
              throw "invalid or untimestamped Authenticode signature: $($signature.Status)"
            }
          } finally {
            if ($bytes) { [Array]::Clear($bytes, 0, $bytes.Length) }
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
          }

      - name: Linux glibc baseline
        if: runner.os == 'Linux'
        run: node scripts/release/check-glibc.mjs ${{ matrix.binary }} 2.35

      - name: Runtime smoke on final native bytes
        run: node scripts/release/smoke-runtime.mjs ${{ matrix.binary }}

      - name: Repeat deterministic battery 20 times
        run: node scripts/release/run-battery.mjs --iterations 20 --binary ${{ matrix.binary }}

      - name: Package Linux native archive
        if: runner.os == 'Linux'
        run: bun scripts/release/package-native.ts --target linux-x64 --binary ${{ matrix.binary }} --output target/native-packages

      - name: Package Windows native archive
        if: runner.os == 'Windows'
        run: bun scripts/release/package-native.ts --target win32-x64 --binary ${{ matrix.binary }} --output target/native-packages

      - name: Stage Linux evidence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir staged
          cp '${{ matrix.binary }}' staged/workflowd
          cp target/native-packages/*.tgz target/native-packages/*.sha256 staged/
          node scripts/release/check-glibc.mjs staged/workflowd 2.35 > staged/glibc.txt

      - name: Stage Windows evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staged | Out-Null
          Copy-Item -LiteralPath '${{ matrix.binary }}' -Destination staged\workflowd.exe
          Copy-Item -Path target\native-packages\*.tgz,target\native-packages\*.sha256 -Destination staged
          $signature = Get-AuthenticodeSignature -LiteralPath staged\workflowd.exe
          [ordered]@{
            status = [string]$signature.Status
            signer = $signature.SignerCertificate.Subject
            thumbprint = $signature.SignerCertificate.Thumbprint
            timestamp_signer = $signature.TimeStamperCertificate.Subject
          } | ConvertTo-Json | Set-Content -LiteralPath staged\authenticode.json -Encoding utf8NoBOM

      - name: Upload native candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-${{ matrix.target }}-${{ needs.admission.outputs.sha }}
          path: staged
          if-no-files-found: error
          retention-days: 14

  seal:
    needs: [admission, native]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout admitted SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.admission.outputs.sha }}
          fetch-depth: 0

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install pinned cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Download Windows native candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: native-win32-x64-${{ needs.admission.outputs.sha }}
          path: inputs/windows

      - name: Download Linux native candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: native-linux-x64-${{ needs.admission.outputs.sha }}
          path: inputs/linux

      - name: Build MCP from the admitted source
        working-directory: mcp
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
          bun run test

      - name: Generate Rust license evidence
        run: node scripts/release/generate-rust-licenses.mjs

      - name: Stage native bytes for assembly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          cp inputs/windows/workflowd.exe bin/workflowd.exe
          cp inputs/linux/workflowd bin/workflowd
          chmod 700 bin/workflowd

      - name: Assemble self-contained plugin
        run: bun scripts/packaging/assemble-plugin.ts

      - name: Generate exact-artifact SBOM notices and provenance
        run: bun scripts/release/generate-supply-chain.mjs --plugin plugin --source-sha ${{ needs.admission.outputs.sha }}

      - name: Validate assembled marketplace content
        run: |
          node scripts/packaging/verify-plugin-source-sync.mjs
          node scripts/validate-marketplace.mjs

      - name: Build official-format immutable ZIP
        run: python scripts/packaging/package-plugin.py --plugin plugin --output sealed/zcode-cycle-${{ env.VERSION }}.zip

      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp inputs/windows/*.tgz inputs/windows/*.sha256 sealed/
          cp inputs/windows/authenticode.json sealed/
          cp inputs/linux/*.tgz inputs/linux/*.sha256 sealed/
          cp plugin/SBOM.cdx.json plugin/provenance.intoto.json sealed/
          cp plugin/THIRD-PARTY-NOTICES.md plugin/THIRD-PARTY-NPM-LICENSES.html plugin/THIRD-PARTY-RUST-LICENSES.html sealed/
          node scripts/release/seal-artifacts.mjs --directory sealed --source-sha ${{ needs.admission.outputs.sha }} --version $VERSION
          node scripts/release/verify-release-manifest.mjs sealed
          cp -R sealed verify-copy
          node scripts/release/verify-release-manifest.mjs verify-copy

      - name: Upload sealed candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sealed-${{ needs.admission.outputs.sha }}
          path: sealed
          if-no-files-found: error
          retention-days: 14

  clean-install:
    needs: [admission, seal]
    name: clean-install-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-11-x64
            os: windows-2025
          - target: ubuntu-22.04-x64
            os: ubuntu-22.04
          - target: ubuntu-24.04-x64
            os: ubuntu-24.04
    steps:
      - name: Checkout admitted SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.admission.outputs.sha }}

      - name: Install pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the same sealed bytes
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: sealed-${{ needs.admission.outputs.sha }}
          path: sealed

      - name: Verify sealed manifest
        run: node scripts/release/verify-release-manifest.mjs sealed

      - name: Verify Windows signature inside the plugin ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path signature-check | Out-Null
          tar -xf sealed\zcode-cycle-${{ env.VERSION }}.zip -C signature-check
          $signature = Get-AuthenticodeSignature -LiteralPath signature-check\zcode-cycle\bin\win32-x64\workflowd.exe
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
            throw "sealed Windows binary signature is invalid: $($signature.Status)"
          }

      - name: Clean-install runtime smoke
        run: node scripts/release/clean-install-smoke.mjs --archive sealed/zcode-cycle-${{ env.VERSION }}.zip --receipt clean-install-${{ matrix.target }}.json

      - name: Upload clean-install receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: clean-install-${{ matrix.target }}-${{ needs.admission.outputs.sha }}
          path: clean-install-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: [admission, clean-install]
    runs-on: ubuntu-22.04
    steps:
      - name: Download certified bytes
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: sealed-${{ needs.admission.outputs.sha }}
          path: sealed

      - name: Attest sealed artifacts
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: |
            sealed/zcode-cycle-${{ env.VERSION }}.zip
            sealed/zcode-cycle-native-linux-x64-${{ env.VERSION }}.tgz
            sealed/zcode-cycle-native-win32-x64-${{ env.VERSION }}.tgz
