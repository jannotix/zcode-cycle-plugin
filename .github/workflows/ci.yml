name: quality

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "26.3.0"
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  quality:
    name: quality-${{ matrix.target }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
            binary: target/release/workflowd
          - target: win32-x64
            os: windows-2025
            binary: target/release/workflowd.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache Rust outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Install pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Rust format
        run: cargo fmt --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --all-features --no-fail-fast

      - name: Install locked MCP dependencies
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: MCP typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: MCP build
        working-directory: mcp
        run: bun run build

      - name: MCP boundary tests
        working-directory: mcp
        run: bun run test

      - name: JavaScript dependency audit
        working-directory: mcp
        run: bun audit --production

      - name: ZCode marketplace contract
        run: node scripts/validate-marketplace.mjs

      - name: Role and release-evidence regression
        run: node --test tests/qualification/*.test.mjs

      - name: Build release daemon
        run: cargo build --release --locked -p workflowd

      - name: Runtime smoke
        run: node scripts/release/smoke-runtime.mjs

      - name: Linux glibc baseline
        if: runner.os == 'Linux'
        run: node scripts/release/check-glibc.mjs ${{ matrix.binary }} 2.35

      - name: Deterministic qualification battery
        run: node scripts/release/run-battery.mjs --iterations 1

      - name: Package Linux native archive
        if: runner.os == 'Linux'
        run: bun scripts/release/package-native.ts --target linux-x64 --binary ${{ matrix.binary }} --output target/native-packages

      - name: Package Windows native archive
        if: runner.os == 'Windows'
        run: bun scripts/release/package-native.ts --target win32-x64 --binary ${{ matrix.binary }} --output target/native-packages

      - name: Upload bounded native evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ matrix.binary }}
            target/native-packages/*.tgz
            target/native-packages/*.sha256
          if-no-files-found: error
          retention-days: 7

  rust-security-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked Rust dependencies
        run: cargo audit

      - name: Install pinned cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked

      - name: Verify Rust license evidence is reproducible
        run: |
          node scripts/release/generate-rust-licenses.mjs target/THIRD-PARTY-RUST-LICENSES.html
          cmp THIRD-PARTY-RUST-LICENSES.html target/THIRD-PARTY-RUST-LICENSES.html
